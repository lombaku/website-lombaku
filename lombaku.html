<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LombaKu – One event, One experience</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--navy:#142B4A;--blue:#2563EB;--lb:#DBEAFE;--bg:#F5F8FC;--tx:#1E293B;--t2:#64748B;--ok:#16A34A;--warn:#F59E0B;--bad:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}.muted{color:var(--t2)}.grow{flex:1}.logo{font-weight:700;font-size:1.3rem}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));padding:16px}
.login-card{background:#fff;padding:32px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 30px #0004}
.login-card label,.form label{display:block;margin-top:14px;font-size:.85rem;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;margin-top:6px;border:1px solid #CBD5E1;border-radius:8px;font:inherit}
.pw{position:relative}.pw button{position:absolute;right:4px;top:8px;border:0;background:none;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:16px}
.btn.sm{padding:6px 10px;margin:0;font-size:.8rem}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.alt{background:var(--lb);color:var(--blue)}
.ghost{background:none;border:0;cursor:pointer;font:inherit;position:relative}.err{color:var(--bad);margin-top:10px;font-size:.85rem}
.demo{margin-top:18px;padding:10px;background:var(--lb);border-radius:8px;font-size:.78rem}
#app{display:flex;min-height:100vh}#side{width:240px;background:var(--navy);color:#fff;padding:18px 12px;transition:.2s;flex-shrink:0}
#side.col{width:64px}#side.col span,#side.col .nl{display:none}#side .logo{margin-bottom:18px;padding:0 8px}
#nav a{display:flex;gap:10px;padding:10px;border-radius:8px;color:#cbd5e1;cursor:pointer;margin-bottom:2px}
#nav a:hover{background:#ffffff14}#nav a.on{background:var(--blue);color:#fff}
main{flex:1;min-width:0}header{display:flex;align-items:center;gap:12px;background:#fff;padding:12px 20px;box-shadow:0 1px 3px #0001;position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:1.1rem}#bc{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:.65rem;padding:0 5px;font-style:normal}
#view{padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0001}.stat b{font-size:1.8rem;display:block;color:var(--blue)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:22px;margin-bottom:16px}
.cd{display:flex;gap:10px;margin-top:10px}.cd div{background:#ffffff22;padding:8px 12px;border-radius:8px;text-align:center}.cd b{display:block;font-size:1.3rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--lb);color:var(--blue)}
.tag.ok{background:#DCFCE7;color:var(--ok)}.tag.bad{background:#FEE2E2;color:var(--bad)}.tag.warn{background:#FEF3C7;color:#B45309}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input,.bar select{margin:0;width:auto;flex:1;min-width:130px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #E2E8F0;font-size:.88rem}
th{background:var(--lb)}.scroll{overflow-x:auto}.empty{text-align:center;padding:40px;color:var(--t2)}
#modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:grid;gap:8px}.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;border-left:4px solid var(--ok)}.toast.bad{border-color:var(--bad)}
@media(max-width:800px){#side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}#side.open{transform:none}#side.col{width:240px}#side.col span,#side.col .nl{display:inline}
#who{display:none}#view{padding:12px}.mact{flex-wrap:wrap}}
</style></head><body>
<section id="login" hidden><form class="login-card" id="loginForm"><div class="logo">🏆 LombaKu</div><p class="muted">One event, One experience</p>
<label>Email / Username<input id="lu" autocomplete="username" required></label>
<label>Password<div class="pw"><input id="lp" type="password" autocomplete="current-password" required><button type="button" id="tpw">👁</button></div></label>
<div id="lerr" class="err" hidden>Username atau password salah.</div><button class="btn">Masuk</button>
<div class="demo"><b>Akun demo</b><br>siswa / siswa123 · juri / juri123<br>admin / admin123 · super / super123</div></form></section>
<div id="app" hidden><aside id="side"><div class="logo">🏆 <span>LombaKu</span></div><nav id="nav"></nav></aside>
<main><header><button id="burger" class="ghost">☰</button><h2 id="title"></h2><span class="grow"></span><button class="ghost" id="bell">🔔<i id="bc"></i></button><span id="who" class="muted"></span><button class="ghost" id="out">Keluar</button></header><div id="view"></div></main></div>
<div id="modal" hidden></div><div id="toasts"></div>
<script>const DB_KEY='lombaku_db_v1';
const SEED={event:{name:'Class Meeting SMA Nusantara 2026',theme:'Sportivitas & Kreativitas',date:'2026-12-15T08:00:00',location:'Lapangan Utama SMA Nusantara',status:'Akan datang'},
users:[{u:'siswa',p:'siswa123',role:'student',name:'Rina Maharani',cls:'XI IPA 1',nis:'2024101'},{u:'juri',p:'juri123',role:'judge',name:'Bu Sari, S.Pd',comps:[3,4]},{u:'admin',p:'admin123',role:'admin',name:'Panitia Budi'},{u:'super',p:'super123',role:'super',name:'Super Admin'}],
comps:[{id:1,name:'Futsal',cat:'Olahraga',type:'Tim',quota:8,open:true,date:'2026-12-15',loc:'Lapangan Utama',req:'Tim 5–7 orang'},
{id:2,name:'Basket 3x3',cat:'Olahraga',type:'Tim',quota:6,open:true,date:'2026-12-16',loc:'Lapangan Basket',req:'Tim 3–4 orang'},
{id:3,name:'Cerdas Cermat',cat:'Akademik',type:'Tim',quota:10,open:true,date:'2026-12-16',loc:'Aula',req:'Tim 3 orang'},
{id:4,name:'Lomba Poster Digital',cat:'Seni',type:'Individu',quota:20,open:true,date:'2026-12-17',loc:'Lab Komputer',req:'Siswa aktif'},
{id:5,name:'Tenis Meja',cat:'Olahraga',type:'Individu',quota:2,open:true,date:'2026-12-17',loc:'Ruang Olahraga',req:'Siswa aktif'}],
regs:[{id:1,comp:5,who:'Dimas Pratama',cls:'X IPS 2',date:'2026-11-12',status:'Diterima',reason:''},{id:2,comp:5,who:'Laila Putri',cls:'XII IPA 3',date:'2026-11-13',status:'Diterima',reason:''},{id:3,comp:3,who:'Tim Brainstorm',cls:'XI IPA 2',date:'2026-11-14',status:'Menunggu',reason:''}],
notifs:[{id:1,role:'student',text:'Selamat datang di LombaKu!',read:false}],logs:[],maintenance:false};
const DB={d:null,load(){try{this.d=JSON.parse(localStorage.getItem(DB_KEY))}catch(e){}if(!this.d){this.d=JSON.parse(JSON.stringify(SEED));this.save()}return this.d},
save(){localStorage.setItem(DB_KEY,JSON.stringify(this.d))},reset(){localStorage.removeItem(DB_KEY);this.d=null;this.load()},
log(user,act,type){this.d.logs.unshift({t:new Date().toLocaleString('id-ID'),user,act,type});this.save()},
used(cid){return this.d.regs.filter(r=>r.comp==cid&&['Menunggu','Diterima'].includes(r.status)).length},
nextId(a){return a.reduce((m,x)=>Math.max(m,x.id),0)+1}};

const $=s=>document.querySelector(s);const PAGES={};let ME=null,PAGE=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,bad){const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3000)}
function modal(title,body,onOk,okLabel='Simpan'){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="mbox"><h3>${title}</h3><div class="form">${body}</div><div class="mact"><button class="btn alt" id="mc">Batal</button>${onOk?`<button class="btn" id="mo">${okLabel}</button>`:''}</div></div>`;
$('#mc').onclick=closeModal;if(onOk)$('#mo').onclick=()=>{if(onOk()!==false)closeModal()}}
function closeModal(){$('#modal').hidden=true}
function confirmBox(msg,fn,label='Ya, lanjutkan'){modal('Konfirmasi',`<p>${msg}</p>`,fn,label)}
function boot(){DB.load();const s=sessionStorage.getItem('lk_user');if(s){ME=DB.d.users.find(u=>u.u===s);if(ME)return start()}$('#login').hidden=false}
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=ME.name;
if(DB.d.maintenance&&ME.role!=='super'){$('#view').innerHTML='<div class="card empty">🛠 Website sedang dalam pemeliharaan. Silakan kembali lagi nanti.</div>';$('#nav').innerHTML='';return}
const list=PAGES[ME.role];$('#nav').innerHTML=list.map(p=>`<a data-p="${p.id}"><span>${p.icon}</span><span class="nl">${p.label}</span></a>`).join('');
$('#nav').onclick=e=>{const a=e.target.closest('a');if(a){go(a.dataset.p);$('#side').classList.remove('open')}};go(list[0].id);notifUI()}
function go(id){PAGE=PAGES[ME.role].find(p=>p.id===id);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===id));$('#title').textContent=PAGE.label;$('#view').innerHTML='<div class="empty">Memuat…</div>';setTimeout(()=>PAGE.render($('#view')),120)}
function refresh(){PAGE.render($('#view'));notifUI()}
function notifUI(){const n=DB.d.notifs.filter(x=>x.role===ME.role&&!x.read).length;$('#bc').textContent=n;$('#bc').hidden=!n}
function notify(role,text){DB.d.notifs.unshift({id:DB.nextId(DB.d.notifs),role,text,read:false});DB.save()}
document.addEventListener('click',e=>{if(e.target.id==='burger'){const s=$('#side');innerWidth<=800?s.classList.toggle('open'):s.classList.toggle('col')}
if(e.target.id==='out'){sessionStorage.clear();location.reload()}
if(e.target.closest('#bell')){const l=DB.d.notifs.filter(x=>x.role===ME.role);modal('Notifikasi',l.length?l.map(x=>`<p>${x.read?'':'🔵 '}${esc(x.text)}</p>`).join(''):'<div class="empty">Belum ada notifikasi</div>',()=>{l.forEach(x=>x.read=true);DB.save();notifUI();toast('Semua ditandai dibaca')},'Tandai semua dibaca')}});

$('#tpw').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};
$('#loginForm').onsubmit=e=>{e.preventDefault();const u=DB.d.users.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value&&!x.off);
if(!u){$('#lerr').hidden=false;return}ME=u;sessionStorage.setItem('lk_user',u.u);DB.log(u.name,'Login','Auth');start()};

function badge(s){return `<span class="tag ${{Diterima:'ok',Ditolak:'bad',Menunggu:'warn',Dibatalkan:'bad'}[s]||''}">${s}</span>`}
function countdown(el){const d=Math.max(0,new Date(DB.d.event.date)-Date.now());const v=[['Hari',d/864e5],['Jam',d/36e5%24],['Menit',d/6e4%60],['Detik',d/1e3%60]];
el.innerHTML=v.map(([l,n])=>`<div><b>${Math.floor(n)}</b>${l}</div>`).join('')}
function studentDash(v){const e=DB.d.event,c=DB.d.comps;v.innerHTML=`<div class="hero"><h2 style="margin:0">Halo, ${esc(ME.name)} 👋</h2><div>${esc(ME.cls)} · ${esc(e.name)} <span class="tag">${e.status}</span></div><div class="cd" id="cd"></div></div>
<div class="grid"><div class="card stat"><b>${c.length}</b>Lomba tersedia</div><div class="card stat"><b>${DB.d.regs.filter(r=>r.status==='Diterima').length}</b>Peserta diterima</div><div class="card stat"><b>${DB.d.regs.filter(r=>r.who===ME.name).length}</b>Pendaftaran saya</div></div>
<div class="bar" style="margin-top:16px"><button class="btn" onclick="go('lomba')">Lihat Daftar Lomba</button></div>`;countdown($('#cd'));clearInterval(window._cd);window._cd=setInterval(()=>$('#cd')?countdown($('#cd')):clearInterval(window._cd),1000)}
function studentLomba(v){v.innerHTML=`<div class="bar"><input id="q" placeholder="Cari lomba…"><select id="fc"><option value="">Semua kategori</option>${[...new Set(DB.d.comps.map(c=>c.cat))].map(c=>`<option>${c}</option>`).join('')}</select><select id="ft"><option value="">Individu & Tim</option><option>Individu</option><option>Tim</option></select></div><div class="grid" id="cl"></div>`;
const draw=()=>{const q=$('#q').value.toLowerCase(),fc=$('#fc').value,ft=$('#ft').value;const l=DB.d.comps.filter(c=>c.name.toLowerCase().includes(q)&&(!fc||c.cat===fc)&&(!ft||c.type===ft));
$('#cl').innerHTML=l.length?l.map(c=>{const full=DB.used(c.id)>=c.quota||!c.open;return `<div class="card"><span class="tag">${c.cat}</span> <span class="tag">${c.type}</span><h3>${esc(c.name)}</h3><p class="muted">📅 ${c.date} · 📍 ${esc(c.loc)}<br>Kuota: ${DB.used(c.id)}/${c.quota}</p>${full?'<span class="tag bad">Pendaftaran ditutup</span>':`<button class="btn sm" onclick="regForm(${c.id})">Daftar</button>`} <button class="btn sm alt" onclick="detail(${c.id})">Detail</button></div>`}).join(''):'<div class="empty">Tidak ada lomba ditemukan</div>'};
['q','fc','ft'].forEach(i=>$('#'+i).oninput=draw);draw()}
function detail(id){const c=DB.d.comps.find(x=>x.id==id);modal(esc(c.name),`<p>${c.cat} · ${c.type}</p><p>Persyaratan: ${esc(c.req)}</p><p>Jadwal: ${c.date} di ${esc(c.loc)}</p>`)}
function regForm(id){const c=DB.d.comps.find(x=>x.id==id);modal('Daftar: '+esc(c.name),`<label>${c.type==='Tim'?'Nama tim':'Nama peserta'}<input id="rn" value="${c.type==='Tim'?'':esc(ME.name)}"></label><label>Kelas<input id="rc" value="${esc(ME.cls)}"></label><label>Catatan<textarea id="rx"></textarea></label>`,()=>{const n=$('#rn').value.trim();if(n.length<3){toast('Nama minimal 3 karakter',1);return false}
if(DB.d.regs.some(r=>r.comp==id&&r.who===n&&r.status!=='Dibatalkan')){toast('Sudah terdaftar',1);return false}
DB.d.regs.push({id:DB.nextId(DB.d.regs),comp:id,who:n,cls:$('#rc').value,date:new Date().toISOString().slice(0,10),status:'Menunggu',reason:''});DB.log(ME.name,'Mendaftar '+c.name,'Registrasi');notify('student','Pendaftaran '+c.name+' berhasil dikirim');DB.save();toast('Pendaftaran terkirim');refresh()},'Kirim pendaftaran')}
function studentRiwayat(v){const l=DB.d.regs.filter(r=>r.who===ME.name||r.cls===ME.cls);v.innerHTML=l.length?`<div class="scroll"><table><tr><th>Lomba</th><th>Tanggal</th><th>Peserta</th><th>Status</th><th>Alasan</th><th></th></tr>${l.map(r=>`<tr><td>${esc(DB.d.comps.find(c=>c.id==r.comp)?.name)}</td><td>${r.date}</td><td>${esc(r.who)}</td><td>${badge(r.status)}</td><td>${esc(r.reason)||'-'}</td><td>${r.status==='Menunggu'?`<button class="btn sm bad" onclick="cancelReg(${r.id})">Batalkan</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="card empty">Belum ada pendaftaran</div>'}
function cancelReg(id){confirmBox('Batalkan pendaftaran ini?',()=>{DB.d.regs.find(r=>r.id==id).status='Dibatalkan';DB.save();toast('Dibatalkan');refresh()})}
PAGES.student=[{id:'dash',label:'Dashboard',icon:'🏠',render:studentDash},{id:'lomba',label:'Daftar Lomba',icon:'🏅',render:studentLomba},{id:'riwayat',label:'Riwayat Pendaftaran',icon:'📝',render:studentRiwayat}];

function adminDash(v){const d=DB.d;v.innerHTML=`<div class="grid"><div class="card stat"><b>${d.comps.length}</b>Total lomba</div><div class="card stat"><b>${d.regs.length}</b>Total pendaftaran</div><div class="card stat"><b>${d.regs.filter(r=>r.status==='Menunggu').length}</b>Menunggu konfirmasi</div><div class="card stat"><b>${d.logs.length}</b>Aktivitas tercatat</div></div>`}
function adminLomba(v){v.innerHTML=`<div class="bar"><input id="q" placeholder="Cari lomba…"><button class="btn sm" onclick="lombaForm()">+ Tambah Lomba</button></div><div class="scroll" id="t"></div>`;const draw=()=>{const q=$('#q').value.toLowerCase();const l=DB.d.comps.filter(c=>c.name.toLowerCase().includes(q));
$('#t').innerHTML=l.length?`<table><tr><th>Lomba</th><th>Kategori</th><th>Jenis</th><th>Kuota</th><th>Pendaftaran</th><th>Aksi</th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.cat)}</td><td>${c.type}</td><td>${DB.used(c.id)}/${c.quota}</td><td><button class="btn sm ${c.open?'ok':'bad'}" onclick="toggleOpen(${c.id})">${c.open?'Dibuka':'Ditutup'}</button></td><td><button class="btn sm alt" onclick="lombaForm(${c.id})">Edit</button> <button class="btn sm bad" onclick="delLomba(${c.id})">Hapus</button></td></tr>`).join('')}</table>`:'<div class="empty">Data kosong</div>'};$('#q').oninput=draw;draw()}
function lombaForm(id){const c=id?DB.d.comps.find(x=>x.id==id):{name:'',cat:'Olahraga',type:'Tim',quota:10,loc:'',date:'',req:'',open:true};
modal(id?'Edit Lomba':'Tambah Lomba',`<label>Nama<input id="fn" value="${esc(c.name)}"></label><label>Kategori<input id="fk" value="${esc(c.cat)}"></label><label>Jenis<select id="fj"><option ${c.type==='Tim'?'selected':''}>Tim</option><option ${c.type==='Individu'?'selected':''}>Individu</option></select></label><label>Kuota<input id="fq" type="number" min="1" value="${c.quota}"></label><label>Tanggal<input id="fd" type="date" value="${c.date}"></label><label>Lokasi<input id="fl" value="${esc(c.loc)}"></label><label>Persyaratan<input id="fr" value="${esc(c.req)}"></label>`,()=>{
if(!$('#fn').value.trim()||+$('#fq').value<1){toast('Nama & kuota wajib valid',1);return false}
Object.assign(c,{name:$('#fn').value.trim(),cat:$('#fk').value,type:$('#fj').value,quota:+$('#fq').value,date:$('#fd').value,loc:$('#fl').value,req:$('#fr').value});
if(!id){c.id=DB.nextId(DB.d.comps);DB.d.comps.push(c)}DB.log(ME.name,(id?'Mengubah':'Menambah')+' lomba '+c.name,'Lomba');DB.save();toast('Lomba disimpan');refresh()})}
function toggleOpen(id){const c=DB.d.comps.find(x=>x.id==id);c.open=!c.open;DB.log(ME.name,(c.open?'Membuka':'Menutup')+' pendaftaran '+c.name,'Lomba');DB.save();refresh()}
function delLomba(id){confirmBox('Hapus lomba ini beserta pendaftarannya?',()=>{DB.d.comps=DB.d.comps.filter(c=>c.id!=id);DB.d.regs=DB.d.regs.filter(r=>r.comp!=id);DB.log(ME.name,'Menghapus lomba #'+id,'Lomba');DB.save();toast('Lomba dihapus');refresh()},'Hapus')}
function adminReg(v){v.innerHTML=`<div class="bar"><select id="fs"><option value="">Semua status</option><option>Menunggu</option><option>Diterima</option><option>Ditolak</option><option>Dibatalkan</option></select><button class="btn sm alt" onclick="exportReg()">Ekspor CSV</button></div><div class="scroll" id="t"></div>`;
const draw=()=>{const s=$('#fs').value;const r=DB.d.regs.filter(x=>!s||x.status===s);$('#t').innerHTML=r.length?`<table><tr><th>Peserta</th><th>Kelas</th><th>Lomba</th><th>Status</th><th>Aksi</th></tr>${r.map(x=>`<tr><td>${esc(x.who)}</td><td>${esc(x.cls)}</td><td>${esc(DB.d.comps.find(c=>c.id==x.comp)?.name)}</td><td>${badge(x.status)}</td><td>${x.status==='Menunggu'?`<button class="btn sm ok" onclick="setReg(${x.id},'Diterima')">Terima</button> <button class="btn sm bad" onclick="rejectReg(${x.id})">Tolak</button>`:'-'}</td></tr>`).join('')}</table>`:'<div class="empty">Tidak ada data</div>'};$('#fs').oninput=draw;draw()}
function setReg(id,s,reason=''){const r=DB.d.regs.find(x=>x.id==id);r.status=s;r.reason=reason;DB.log(ME.name,`${s} pendaftaran ${r.who}`,'Registrasi');notify('student',`Pendaftaran ${r.who} ${s.toLowerCase()}`);DB.save();toast('Status diperbarui');refresh()}
function rejectReg(id){modal('Tolak pendaftaran',`<label>Alasan<textarea id="ra"></textarea></label>`,()=>{if(!$('#ra').value.trim()){toast('Alasan wajib diisi',1);return false}setReg(id,'Ditolak',$('#ra').value)},'Tolak')}
function exportReg(){const rows=[['Peserta','Kelas','Lomba','Status'],...DB.d.regs.map(r=>[r.who,r.cls,DB.d.comps.find(c=>c.id==r.comp)?.name,r.status])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='pendaftaran.csv';a.click();toast('CSV diekspor')}

/* Tahap 2: pertandingan, Live Arena, bagan editable, hasil juara, ranking, pengumuman */
function S2(){const d=DB.d;if(!d.matches){d.matches=[
{id:1,comp:1,round:'Semifinal',a:'XI IPA 1',b:'X IPS 2',sa:3,sb:1,status:'FINISHED',date:'2026-12-15',time:'08:00',loc:'Lapangan Utama',next:3,slot:'a'},
{id:2,comp:1,round:'Semifinal',a:'XII IPA 3',b:'XI IPS 1',sa:1,sb:1,status:'LIVE',date:'2026-12-15',time:'09:00',loc:'Lapangan Utama',next:3,slot:'b'},
{id:3,comp:1,round:'Final',a:'XI IPA 1',b:'TBD',sa:0,sb:0,status:'NEXT',date:'2026-12-15',time:'13:00',loc:'Lapangan Utama'},
{id:4,comp:2,round:'Semifinal',a:'XII IPS 2',b:'X IPA 1',sa:0,sb:0,status:'UPCOMING',date:'2026-12-16',time:'08:00',loc:'Lapangan Basket'}];
d.champs=[{id:1,comp:5,pos:1,cls:'XII IPA 3',score:92,pub:true},{id:2,comp:5,pos:2,cls:'X IPS 2',score:88,pub:true}];
d.points={1:10,2:7,3:5};d.editing=null;d.ann=[{id:1,title:'Pendaftaran Futsal dibuka',body:'Daftarkan kelasmu sebelum kuota penuh.',date:'2026-11-10',pub:true}];DB.save()}return d}
const ST={LIVE:'bad',NEXT:'warn',UPCOMING:'',FINISHED:'ok'},RO=['Penyisihan','Semifinal','Final','Juara 3'];
const cn=id=>DB.d.comps.find(c=>c.id==id)?.name||'-';
const vis=()=>{const d=S2();return d.editing?JSON.parse(d.editing.snap):d.matches};
const canEdit=()=>{const e=S2().editing;return e&&e.by===ME.name};
function mcard(m){return `<div class="card"><span class="tag ${ST[m.status]}">${m.status==='LIVE'?'● LIVE':m.status}</span> <span class="tag">${esc(cn(m.comp))} · ${esc(m.round)}</span><h3>${esc(m.a)} <span class="muted">vs</span> ${esc(m.b)}</h3><div style="font-size:1.6rem;font-weight:700">${m.sa} – ${m.sb}</div><p class="muted">🕐 ${m.date} ${m.time} · 📍 ${esc(m.loc)}</p></div>`}
function arena(v){const l=vis(),g=s=>l.filter(m=>m.status===s);v.innerHTML=['LIVE','NEXT','UPCOMING','FINISHED'].map(s=>`<h3>${s}</h3><div class="grid">${g(s).map(mcard).join('')||'<div class="muted">Tidak ada</div>'}</div>`).join('')}
function box(m,ed){const w=m.status==='FINISHED'?(m.sa>m.sb?'a':m.sb>m.sa?'b':''):'';const row=(k,n,s)=>`<div style="display:flex;justify-content:space-between;gap:14px;${w===k?'font-weight:700;color:var(--ok)':''}"><span>${esc(n)}</span><span>${s}</span></div>`;
return `<div class="card" style="margin:10px 0;min-width:190px">${row('a',m.a,m.sa)}${row('b',m.b,m.sb)}<span class="tag ${ST[m.status]}">${m.status}</span>${ed?` <button class="btn sm alt" onclick="matchForm(${m.id})">Edit</button> <button class="btn sm bad" onclick="delMatch(${m.id})">Hapus</button>`:''}</div>`}
function tree(cid,ed){const ms=(ed?S2().matches:vis()).filter(m=>m.comp==cid);if(!ms.length)return '<div class="card empty">Belum ada bagan untuk lomba ini</div>';
const rs=[...new Set(ms.map(m=>m.round))].sort((x,y)=>RO.indexOf(x)-RO.indexOf(y));return `<div class="scroll"><div style="display:flex;gap:24px;min-width:max-content">${rs.map(r=>`<div><b>${esc(r)}</b>${ms.filter(m=>m.round===r).map(m=>box(m,ed)).join('')}</div>`).join('')}</div></div>`}
const compSel=()=>`<select id="bc2">${DB.d.comps.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`;
function studentBracket(v){const e=S2().editing;v.innerHTML=`<div class="bar">${compSel()}</div>${e?`<p class="tag warn">Bagan sedang diperbarui panitia — tampilan di bawah adalah versi resmi terakhir</p>`:''}<div id="tr"></div>`;$('#bc2').oninput=()=>$('#tr').innerHTML=tree($('#bc2').value);$('#bc2').oninput()}
function adminBracket(v){const d=S2(),e=d.editing,mine=canEdit();
v.innerHTML=`<div class="card" style="margin-bottom:14px">${e?`<span class="tag warn">● Sedang diedit oleh ${esc(e.by)}</span> <span class="muted">${e.n} perubahan belum diterapkan</span>`:'<span class="tag ok">Tidak sedang diedit</span>'}<div class="bar" style="margin:10px 0 0">${!e?'<button class="btn sm" onclick="startEdit()">Mulai edit bagan</button>':mine?'<button class="btn sm ok" onclick="saveEdit()">Simpan</button><button class="btn sm bad" onclick="cancelEdit()">Batal</button><button class="btn sm alt" onclick="matchForm()">+ Tambah pertandingan</button><button class="btn sm alt" onclick="genForm()">⚙ Buat bagan otomatis</button>':''}</div></div><div class="bar">${compSel()}</div><div id="tr"></div>`;
$('#bc2').oninput=()=>$('#tr').innerHTML=tree($('#bc2').value,mine);$('#bc2').oninput()}
function startEdit(){const d=S2();if(d.editing)return toast('Sedang diedit '+d.editing.by,1);d.editing={by:ME.name,snap:JSON.stringify(d.matches),n:0};DB.log(ME.name,'Mulai mengedit bagan','Bagan');DB.save();refresh()}
function cancelEdit(){confirmBox('Batalkan semua perubahan?',()=>{const d=S2();d.matches=JSON.parse(d.editing.snap);d.editing=null;DB.save();toast('Perubahan dibatalkan');refresh()},'Batalkan')}
function saveEdit(){confirmBox('Terapkan perubahan ke halaman siswa?',()=>{const d=S2();DB.log(ME.name,`Menyimpan bagan (${d.editing.n} perubahan)`,'Bagan');d.editing=null;notify('student','Bagan/skor pertandingan diperbarui');DB.save();toast('Bagan diterapkan');refresh()},'Terapkan')}
function matchForm(id){const d=S2(),m=id?d.matches.find(x=>x.id==id):{comp:+$('#bc2').value,round:'Semifinal',a:'',b:'',sa:0,sb:0,status:'UPCOMING',date:'2026-12-15',time:'08:00',loc:''};
const o=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
modal(id?'Edit pertandingan':'Tambah pertandingan',`<label>Babak<select id="mr">${o(RO,m.round)}</select></label><label>Tim A<input id="ma" value="${esc(m.a)}"></label><label>Tim B<input id="mb" value="${esc(m.b)}"></label><label>Skor A<input id="msa" type="number" min="0" value="${m.sa}"></label><label>Skor B<input id="msb" type="number" min="0" value="${m.sb}"></label><label>Status<select id="ms">${o(Object.keys(ST),m.status)}</select></label><label>Tanggal<input id="md" type="date" value="${m.date}"></label><label>Jam<input id="mt" type="time" value="${m.time}"></label><label>Lokasi<input id="ml" value="${esc(m.loc)}"></label>`,()=>{
if(!$('#ma').value.trim()||!$('#mb').value.trim()||+$('#msa').value<0||+$('#msb').value<0){toast('Tim & skor wajib valid',1);return false}
const old=`${m.sa}-${m.sb}`;Object.assign(m,{round:$('#mr').value,a:$('#ma').value.trim(),b:$('#mb').value.trim(),sa:+$('#msa').value,sb:+$('#msb').value,status:$('#ms').value,date:$('#md').value,time:$('#mt').value,loc:$('#ml').value});
if(!id){m.id=DB.nextId(d.matches);d.matches.push(m)}
if(m.status==='FINISHED'&&m.sa===m.sb){toast('Skor seri: tentukan pemenang dulu',1);m.status='LIVE'}
if(m.status==='FINISHED'&&m.next){const n=d.matches.find(x=>x.id==m.next);if(n)n[m.slot]=m.sa>m.sb?m.a:m.b}
d.editing.n++;DB.log(ME.name,`Skor ${m.a} vs ${m.b}: ${old} → ${m.sa}-${m.sb} (${m.status})`,'Skor');DB.save();toast('Perubahan ditampung (belum diterapkan)');refresh()})}
function delMatch(id){confirmBox('Hapus pertandingan ini?',()=>{const d=S2();d.matches=d.matches.filter(m=>m.id!=id);d.editing.n++;DB.save();refresh()},'Hapus')}
/* Hasil juara & ranking */
const medal=p=>({1:'🥇',2:'🥈',3:'🥉'}[p]||'🏅');
function studentHasil(v){const d=S2();v.innerHTML=d.comps.map(c=>{const l=d.champs.filter(x=>x.comp==c.id&&x.pub).sort((a,b)=>a.pos-b.pos);return l.length?`<div class="card" style="margin-bottom:14px"><h3>${esc(c.name)}</h3>${l.map(x=>`<p>${medal(x.pos)} ${posLbl(x.pos)} — ${esc(x.cls)}${x.score?` <span class="muted">(nilai ${x.score})</span>`:''}</p>`).join('')}</div>`:''}).join('')||'<div class="card empty">Belum ada hasil resmi yang dipublikasikan</div>'}
function rankData(){const d=S2(),r={};const g=c=>r[c]=r[c]||{cls:c,wins:0,pts:0,juara:0,m:[0,0,0]};
d.matches.filter(m=>m.status==='FINISHED'&&m.sa!==m.sb).forEach(m=>g(m.sa>m.sb?m.a:m.b).wins++);
d.champs.filter(x=>x.pub).forEach(x=>{const e=g(x.cls);e.juara++;e.pts+=d.points[x.pos]||0;if(x.pos<=3)e.m[x.pos-1]++});
return Object.values(r).sort((a,b)=>b.pts-a.pts||b.wins-a.wins)}
function ranking(v){const l=rankData(),d=S2();v.innerHTML=(ME.role==='admin'?`<div class="card" style="margin-bottom:14px">Poin: ${[1,2,3].map(p=>`Juara ${p} <input id="pp${p}" type="number" min="0" value="${d.points[p]}" style="width:70px;display:inline">`).join(' ')} <button class="btn sm" onclick="savePts()">Simpan poin</button></div>`:'')+(l.length?`<div class="scroll"><table><tr><th>#</th><th>Kelas</th><th>Kemenangan</th><th>Juara</th><th>Medali 🥇🥈🥉</th><th>Total poin</th></tr>${l.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.cls)}</td><td>${x.wins}</td><td>${x.juara}</td><td>${x.m.join(' / ')}</td><td><b>${x.pts}</b></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada data</div>')}
function savePts(){const d=S2();[1,2,3].forEach(p=>d.points[p]=+$('#pp'+p).value||0);DB.log(ME.name,'Mengubah sistem poin','Ranking');DB.save();toast('Poin disimpan');refresh()}
function adminHasil(v){const d=S2();v.innerHTML=`<div class="bar">${compSel()}<button class="btn sm" onclick="champForm()">+ Tambah juara</button></div><div id="ct"></div>`;
$('#bc2').oninput=()=>{const cid=+$('#bc2').value,l=d.champs.filter(x=>x.comp===cid).sort((a,b)=>a.pos-b.pos);$('#ct').innerHTML=l.length?`<div class="scroll"><table><tr><th>Juara</th><th>Kelas/Peserta</th><th>Nilai</th><th>Status</th><th>Aksi</th></tr>${l.map(x=>`<tr><td>${medal(x.pos)} ${x.pos}</td><td>${esc(x.cls)}</td><td>${x.score||'-'}</td><td>${x.pub?'<span class="tag ok">Dipublikasikan 🔒</span>':'<span class="tag warn">Draft</span>'}</td><td>${x.pub?'-':`<button class="btn sm ok" onclick="pubChamp(${x.id})">Publikasikan</button> <button class="btn sm bad" onclick="delChamp(${x.id})">Hapus</button>`}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada juara untuk lomba ini</div>'};$('#bc2').oninput()}
function champForm(){const cid=+$('#bc2').value;modal('Tambah juara — '+esc(cn(cid)),`<label>Posisi juara<input id="cp" type="number" min="1" value="1"></label><label>Kelas / peserta<input id="cc"></label><label>Nilai akhir (opsional)<input id="cs" type="number" min="0" max="100"></label>`,()=>{const d=S2(),pos=+$('#cp').value,cls=$('#cc').value.trim();
if(!cls||pos<1){toast('Lengkapi data',1);return false}if(d.champs.some(x=>x.comp===cid&&x.pos===pos)){toast('Posisi sudah terisi',1);return false}
d.champs.push({id:DB.nextId(d.champs),comp:cid,pos,cls,score:+$('#cs').value||0,pub:false});DB.save();toast('Disimpan sebagai draft');$('#bc2').value=cid;refresh();$('#bc2').value=cid;$('#bc2').oninput()},'Simpan draft')}
function pubChamp(id){confirmBox('Publikasikan hasil? Setelah itu hasil terkunci dan muncul di halaman siswa & ranking.',()=>{const x=S2().champs.find(c=>c.id==id);x.pub=true;DB.log(ME.name,`Memublikasikan ${posLbl(x.pos)} ${cn(x.comp)}: ${x.cls}`,'Hasil');notify('student','Hasil lomba '+cn(x.comp)+' diumumkan');DB.save();toast('Dipublikasikan');refresh()},'Publikasikan')}
function delChamp(id){confirmBox('Hapus draft ini?',()=>{const d=S2();d.champs=d.champs.filter(x=>x.id!=id);DB.save();refresh()},'Hapus')}
/* Pengumuman */
function pengumuman(v){const d=S2(),adm=ME.role==='admin',l=adm?d.ann:d.ann.filter(a=>a.pub);v.innerHTML=(adm?'<div class="bar"><button class="btn sm" onclick="annForm()">+ Buat pengumuman</button></div>':'')+(l.map(a=>`<div class="card" style="margin-bottom:12px"><b>${esc(a.title)}</b> ${adm?(a.pub?'<span class="tag ok">Publik</span>':'<span class="tag warn">Draft</span>'):''}<p>${esc(a.body)}</p><span class="muted">${a.date}</span>${adm?` <button class="btn sm alt" onclick="togAnn(${a.id})">${a.pub?'Sembunyikan':'Publikasikan'}</button> <button class="btn sm bad" onclick="delAnn(${a.id})">Hapus</button>`:''}</div>`).join('')||'<div class="card empty">Belum ada pengumuman</div>')}
function annForm(){modal('Pengumuman baru',`<label>Judul<input id="at"></label><label>Isi<textarea id="ab"></textarea></label>`,()=>{if(!$('#at').value.trim()||!$('#ab').value.trim()){toast('Judul & isi wajib',1);return false}const d=S2();d.ann.unshift({id:DB.nextId(d.ann),title:$('#at').value,body:$('#ab').value,date:new Date().toISOString().slice(0,10),pub:true});notify('student','Pengumuman baru: '+$('#at').value);DB.log(ME.name,'Membuat pengumuman','Pengumuman');DB.save();toast('Dipublikasikan');refresh()},'Publikasikan')}
function togAnn(id){const a=S2().ann.find(x=>x.id==id);a.pub=!a.pub;DB.save();refresh()}
function delAnn(id){confirmBox('Hapus pengumuman?',()=>{const d=S2();d.ann=d.ann.filter(a=>a.id!=id);DB.save();refresh()},'Hapus')}
PAGES.student.push({id:'arena',label:'Live Arena',icon:'🔴',render:arena},{id:'bagan',label:'Bagan Pertandingan',icon:'🧩',render:studentBracket},{id:'rank',label:'Ranking',icon:'📈',render:ranking},{id:'hasil',label:'Hasil Juara',icon:'🏆',render:studentHasil},{id:'info',label:'Pengumuman',icon:'📢',render:pengumuman});
PAGES.admin.push({id:'bagan',label:'Bagan & Pertandingan',icon:'🧩',render:adminBracket},{id:'hasil',label:'Hasil Juara',icon:'🏆',render:adminHasil},{id:'rank',label:'Ranking',icon:'📈',render:ranking},{id:'info',label:'Pengumuman',icon:'📢',render:pengumuman});

/* Tahap 3: penilaian juri, kriteria, hasil penilaian, info event, jadwal */
function S3(){const d=S2();if(!d.criteria){d.criteria=[{id:1,comp:3,name:'Ketepatan jawaban',weight:60,max:100},{id:2,comp:3,name:'Kerja sama tim',weight:40,max:100},{id:3,comp:4,name:'Kreativitas',weight:50,max:100},{id:4,comp:4,name:'Teknik',weight:30,max:100},{id:5,comp:4,name:'Kesesuaian tema',weight:20,max:100}];d.scores=[];
d.regs.find(r=>r.id==3).status='Diterima';d.regs.push({id:4,comp:4,who:'Rina Maharani',cls:'XI IPA 1',date:'2026-11-15',status:'Diterima',reason:''},{id:5,comp:4,who:'Dimas Pratama',cls:'X IPS 2',date:'2026-11-16',status:'Diterima',reason:''});
Object.assign(d.event,{desc:'Rangkaian lomba antarkelas untuk mempererat kebersamaan dan sportivitas.',contact:'Panitia: 0812-0000-1111'});DB.save()}return d}
const wsum=cid=>S3().criteria.filter(c=>c.comp==cid).reduce((s,c)=>s+c.weight,0);
const myScore=(cid,who)=>S3().scores.find(s=>s.comp==cid&&s.who===who&&s.judge===ME.u);
function judgeNilai(v){const cs=DB.d.comps.filter(c=>ME.comps.includes(c.id));v.innerHTML=`<div class="bar"><select id="jc">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div id="jl"></div>`;
$('#jc').oninput=()=>{const cid=+$('#jc').value,ps=DB.d.regs.filter(r=>r.comp===cid&&r.status==='Diterima'),w=wsum(cid);
$('#jl').innerHTML=(w!==100?`<p class="tag bad">Total bobot kriteria ${w}% (harus 100%) — hubungi panitia</p>`:'')+(ps.length?`<div class="scroll"><table><tr><th>Peserta</th><th>Kelas</th><th>Status</th><th>Nilai</th><th></th></tr>${ps.map(r=>{const s=myScore(cid,r.who);return `<tr><td>${esc(r.who)}</td><td>${esc(r.cls)}</td><td>${s?(s.status==='sent'?'<span class="tag ok">Terkirim 🔒</span>':'<span class="tag warn">Draft</span>'):'<span class="tag">Belum</span>'}</td><td>${s?s.total.toFixed(1):'-'}</td><td><button class="btn sm" onclick="scoreForm(${cid},${r.id})">${s&&s.status==='sent'?'Lihat':'Nilai'}</button></td></tr>`}).join('')}</table></div>`:'<div class="card empty">Belum ada peserta diterima</div>')};$('#jc').oninput()}
function readVals(){const vals={};let ok=true,tot=0;document.querySelectorAll('.sv').forEach(i=>{const x=i.value===''?null:+i.value,m=+i.dataset.m;if(x===null||x<0||x>m)ok=false;vals[i.dataset.id]=x;tot+=(x||0)/m*i.dataset.w});return{vals,ok,tot}}
function scoreForm(cid,rid){const r=DB.d.regs.find(x=>x.id==rid),cr=S3().criteria.filter(c=>c.comp==cid),s=myScore(cid,r.who)||{vals:{}},lock=s.status==='sent';
if(!cr.length)return toast('Kriteria belum diatur panitia',1);
modal('Nilai: '+esc(r.who),cr.map(c=>`<label>${esc(c.name)} (bobot ${c.weight}%, 0–${c.max})<input class="sv" data-id="${c.id}" data-w="${c.weight}" data-m="${c.max}" type="number" min="0" max="${c.max}" value="${s.vals[c.id]??''}" ${lock?'disabled':''}></label>`).join('')+`<p>Nilai akhir: <b id="tot">0</b> / 100</p>`+(lock?'':`<button class="btn ok" onclick="sendScore(${cid},${rid})">Kirim penilaian</button>`),lock?null:()=>{const x=readVals();if(Object.values(x.vals).some(v=>v!==null&&(v<0))){toast('Nilai di luar rentang',1);return false}saveScore(cid,r.who,x,false)},'Simpan draft');
const rc=()=>$('#tot').textContent=readVals().tot.toFixed(1);document.querySelectorAll('.sv').forEach(i=>i.oninput=rc);rc()}
function saveScore(cid,who,x,send){const d=S3();let s=myScore(cid,who);if(!s){s={id:DB.nextId(d.scores),comp:cid,who,judge:ME.u,jname:ME.name};d.scores.push(s)}Object.assign(s,{vals:x.vals,total:x.tot,status:send?'sent':'draft'});
DB.log(ME.name,`${send?'Mengirim':'Menyimpan draft'} nilai ${who} (${cn(cid)})`,'Penilaian');if(send)notify('admin',`Juri ${ME.name} mengirim nilai ${who}`);DB.save();toast(send?'Penilaian terkirim':'Draft disimpan');refresh()}
function sendScore(cid,rid){const r=DB.d.regs.find(x=>x.id==rid),x=readVals();if(!x.ok)return toast('Semua nilai wajib diisi dalam rentang',1);if(wsum(cid)!==100)return toast('Total bobot kriteria belum 100%',1);
confirmBox(`Kirim nilai ${esc(r.who)} (${x.tot.toFixed(1)})? Setelah terkirim nilai terkunci.`,()=>saveScore(cid,r.who,x,true),'Kirim')}
function judgeRiwayat(v){const l=S3().scores.filter(s=>s.judge===ME.u);v.innerHTML=l.length?`<div class="scroll"><table><tr><th>Lomba</th><th>Peserta</th><th>Nilai</th><th>Status</th></tr>${l.map(s=>`<tr><td>${esc(cn(s.comp))}</td><td>${esc(s.who)}</td><td>${s.total.toFixed(1)}</td><td>${s.status==='sent'?'Terkirim':'Draft'}</td></tr>`).join('')}</table></div>`:'<div class="card empty">Belum ada riwayat penilaian</div>'}
/* Admin: kriteria */
function adminKrit(v){v.innerHTML=`<div class="bar">${compSel()}<button class="btn sm" onclick="critForm()">+ Kriteria</button></div><div id="kt"></div>`;
$('#bc2').oninput=()=>{const cid=+$('#bc2').value,l=S3().criteria.filter(c=>c.comp===cid),w=wsum(cid);$('#kt').innerHTML=`<p>Total bobot: <span class="tag ${w===100?'ok':'bad'}">${w}% ${w===100?'✓ valid':'(harus 100%)'}</span></p>`+(l.length?`<div class="scroll"><table><tr><th>Kriteria</th><th>Bobot</th><th>Nilai maks</th><th>Aksi</th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.weight}%</td><td>${c.max}</td><td><button class="btn sm alt" onclick="critForm(${c.id})">Edit</button> <button class="btn sm bad" onclick="delCrit(${c.id})">Hapus</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada kriteria</div>')};$('#bc2').oninput()}
function critForm(id){const cid=+$('#bc2').value,c=id?S3().criteria.find(x=>x.id==id):{name:'',weight:10,max:100};modal(id?'Edit kriteria':'Tambah kriteria',`<label>Nama<input id="kn" value="${esc(c.name)}"></label><label>Bobot (%)<input id="kw" type="number" min="1" max="100" value="${c.weight}"></label><label>Nilai maksimum<input id="km" type="number" min="1" value="${c.max}"></label>`,()=>{
if(!$('#kn').value.trim()||+$('#kw').value<1||+$('#km').value<1){toast('Data tidak valid',1);return false}Object.assign(c,{name:$('#kn').value.trim(),weight:+$('#kw').value,max:+$('#km').value});
if(!id){c.id=DB.nextId(S3().criteria);c.comp=cid;S3().criteria.push(c)}DB.log(ME.name,'Mengatur kriteria '+cn(cid),'Kriteria');DB.save();toast('Kriteria disimpan');refresh();$('#bc2').value=cid;$('#bc2').oninput()})}
function delCrit(id){confirmBox('Hapus kriteria?',()=>{const d=S3(),cid=+$('#bc2').value;d.criteria=d.criteria.filter(c=>c.id!=id);DB.save();refresh();$('#bc2').value=cid;$('#bc2').oninput()},'Hapus')}
/* Admin: hasil penilaian */
function adminNilai(v){v.innerHTML=`<div class="bar">${compSel()}</div><div id="nt"></div>`;
$('#bc2').oninput=()=>{const cid=+$('#bc2').value,d=S3(),sent=d.scores.filter(s=>s.comp===cid&&s.status==='sent'),agg={};sent.forEach(s=>{(agg[s.who]=agg[s.who]||[]).push(s.total)});
const rk=Object.entries(agg).map(([w,a])=>[w,a.reduce((x,y)=>x+y,0)/a.length,a.length]).sort((a,b)=>b[1]-a[1]);
$('#nt').innerHTML=rk.length?`<h3>Rata-rata nilai</h3><div class="scroll"><table><tr><th>#</th><th>Peserta</th><th>Rata-rata</th><th>Juri</th></tr>${rk.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td>${x[1].toFixed(1)}</td><td>${x[2]}</td></tr>`).join('')}</table></div><div class="bar" style="margin-top:12px"><button class="btn sm" onclick="makeChamps(${cid})">Buat draft juara dari nilai</button></div><h3>Detail per juri</h3><div class="scroll"><table><tr><th>Peserta</th><th>Juri</th><th>Nilai</th><th></th></tr>${sent.map(s=>`<tr><td>${esc(s.who)}</td><td>${esc(s.jname)}</td><td>${s.total.toFixed(1)}</td><td><button class="btn sm alt" onclick="correct(${s.id})">Koreksi</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">Belum ada penilaian terkirim untuk lomba ini</div>'};$('#bc2').oninput()}
function correct(id){modal('Koreksi nilai (buka kunci)','<label>Alasan koreksi<textarea id="cr"></textarea></label>',()=>{if(!$('#cr').value.trim()){toast('Alasan wajib',1);return false}const s=S3().scores.find(x=>x.id==id);s.status='draft';DB.log(ME.name,`Membuka kunci nilai ${s.who} oleh ${s.jname}: ${$('#cr').value}`,'Koreksi');notify('judge','Nilai '+s.who+' dibuka untuk koreksi');DB.save();toast('Nilai dibuka untuk juri');const c=s.comp;refresh();$('#bc2').value=c;$('#bc2').oninput()},'Buka kunci')}
function makeChamps(cid){const d=S3(),agg={};d.scores.filter(s=>s.comp===cid&&s.status==='sent').forEach(s=>(agg[s.who]=agg[s.who]||[]).push(s.total));
const rk=Object.entries(agg).map(([w,a])=>[w,a.reduce((x,y)=>x+y,0)/a.length]).sort((a,b)=>b[1]-a[1]).slice(0,3);
confirmBox('Buat draft Juara 1–3 dari rata-rata nilai? (juara yang sudah ada tidak ditimpa)',()=>{rk.forEach(([w,s],i)=>{if(!d.champs.some(x=>x.comp===cid&&x.pos===i+1)){const rg=d.regs.find(r=>r.comp===cid&&r.who===w);d.champs.push({id:DB.nextId(d.champs),comp:cid,pos:i+1,cls:rg?rg.cls+' – '+w:w,score:+s.toFixed(1),pub:false})}});DB.log(ME.name,'Membuat draft juara dari nilai '+cn(cid),'Hasil');DB.save();toast('Draft juara dibuat — publikasikan di menu Hasil Juara')},'Buat draft')}
/* Info event & jadwal */
function eventInfo(v){const e=S3().event,ad=ME.role==='admin';v.innerHTML=`<div class="hero"><span class="tag">${e.status}</span><h2>${esc(e.name)}</h2><div>${esc(e.theme)}</div></div><div class="card">${e.poster?`<img src="${e.poster}" alt="Poster" style="max-width:100%;border-radius:10px">`:''}<p>${esc(e.desc)}</p><p>📅 ${new Date(e.date).toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'})}<br>📍 ${esc(e.location)}<br>☎ ${esc(e.contact)}</p>${ad?'<button class="btn sm" onclick="eventForm()">Edit event</button> <button class="btn sm alt" onclick="posterUp()">Unggah poster</button>':''}</div>`}
function eventForm(){const e=S3().event;modal('Edit event',`<label>Nama<input id="en" value="${esc(e.name)}"></label><label>Tema<input id="et" value="${esc(e.theme)}"></label><label>Tanggal & jam<input id="ed" type="datetime-local" value="${e.date.slice(0,16)}"></label><label>Lokasi<input id="el" value="${esc(e.location)}"></label><label>Kontak<input id="ek" value="${esc(e.contact)}"></label><label>Deskripsi<textarea id="ex">${esc(e.desc)}</textarea></label><label>Status<select id="es">${['Akan datang','Berlangsung','Selesai'].map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></label>`,()=>{if(!$('#en').value.trim()||!$('#ed').value){toast('Nama & tanggal wajib',1);return false}
Object.assign(e,{name:$('#en').value,theme:$('#et').value,date:$('#ed').value,location:$('#el').value,contact:$('#ek').value,desc:$('#ex').value,status:$('#es').value});DB.log(ME.name,'Mengubah info event','Event');notify('student','Info event diperbarui');DB.save();toast('Event diperbarui');refresh()})}
function sched(){return [...DB.d.comps.map(c=>({date:c.date,time:'',t:c.name+' (hari pelaksanaan)',loc:c.loc,s:''})),...vis().map(m=>({date:m.date,time:m.time,t:`${cn(m.comp)}: ${m.a} vs ${m.b}`,loc:m.loc,s:m.status}))].filter(i=>i.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function jadwal(v){const it=sched(),mode=window._jm||'list',ad=ME.role==='admin';
const row=i=>`<tr><td>${i.date}</td><td>${i.time||'-'}</td><td>${esc(i.t)}</td><td>${esc(i.loc)}</td><td>${i.s?`<span class="tag ${ST[i.s]}">${i.s}</span>`:'-'}</td></tr>`;
let body;if(mode==='list')body=it.length?`<div class="scroll"><table><tr><th>Tanggal</th><th>Jam</th><th>Kegiatan</th><th>Lokasi</th><th>Status</th></tr>${it.map(row).join('')}</table></div>`:'<div class="empty">Belum ada jadwal</div>';
else{const b=new Date(DB.d.event.date),y=b.getFullYear(),m=b.getMonth(),n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay();let c='';for(let i=0;i<f;i++)c+='<div></div>';
for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,x=it.filter(i=>i.date===k).length;c+=`<div class="card" style="padding:8px;min-height:56px;${x?'cursor:pointer;background:var(--lb)':''}" ${x?`onclick="dayList('${k}')"`:''}>${d}${x?`<br><span class="tag">${x} acara</span>`:''}</div>`}
body=`<h3>${b.toLocaleString('id-ID',{month:'long',year:'numeric'})}</h3><div style="display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:6px;overflow-x:auto">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<b>${x}</b>`).join('')}${c}</div>`}
v.innerHTML=`<div class="bar"><button class="btn sm ${mode==='list'?'':'alt'}" onclick="window._jm='list';refresh()">Daftar</button><button class="btn sm ${mode==='cal'?'':'alt'}" onclick="window._jm='cal';refresh()">Kalender</button>${ad?`<button class="btn sm alt" onclick="go('lomba')">Ubah jadwal lomba</button><button class="btn sm alt" onclick="go('bagan')">Ubah jadwal pertandingan</button>`:''}</div>${body}`}
function dayList(k){modal('Jadwal '+k,`<table>${sched().filter(i=>i.date===k).map(row=>`<tr><td>${row.time||'-'}</td><td>${esc(row.t)}<br><span class="muted">${esc(row.loc)}</span></td></tr>`).join('')}</table>`)}
PAGES.student.push({id:'event',label:'Informasi Event',icon:'ℹ️',render:eventInfo},{id:'jadwal',label:'Jadwal',icon:'📅',render:jadwal});
PAGES.admin.push({id:'event',label:'Manajemen Event',icon:'ℹ️',render:eventInfo},{id:'jadwal',label:'Manajemen Jadwal',icon:'📅',render:jadwal},{id:'krit',label:'Kriteria Penilaian',icon:'📋',render:adminKrit},{id:'nilai',label:'Hasil Penilaian',icon:'🧮',render:adminNilai});
PAGES.judge.push({id:'nilai',label:'Form Penilaian',icon:'📝',render:judgeNilai},{id:'riwayat',label:'Riwayat Penilaian',icon:'🕘',render:judgeRiwayat});

/* Tahap 4: tim, voting, profil, manajemen kelas & juri */
function S4(){const d=S3();if(!d.students){d.students=[['Rina Maharani','XI IPA 1'],['Dimas Pratama','X IPS 2'],['Laila Putri','XII IPA 3'],['Andi Saputra','XI IPA 1'],['Bagas Wijaya','XI IPA 1'],['Citra Dewi','XI IPS 1'],['Eko Prasetyo','XII IPS 2'],['Fitri Handayani','X IPA 1'],['Gilang Ramadhan','XI IPA 2'],['Hana Safitri','XI IPA 2']].map(([name,cls],i)=>({name,cls,nis:'2024'+(101+i)}));
d.classes=['X IPA 1','X IPS 2','XI IPA 1','XI IPA 2','XI IPS 1','XII IPA 3','XII IPS 2'];
d.teams=[{id:1,name:'Garuda FC',comp:1,leader:'Dimas Pratama',members:[{name:'Dimas Pratama',st:'Setuju'},{name:'Rina Maharani',st:'Diundang'},{name:'Andi Saputra',st:'Setuju'}],locked:false}];
d.votes=[{id:1,title:'Kelas Terkreatif',open:true,voted:{},cands:[{id:1,name:'XI IPA 1',desc:'Yel-yel paling kompak',count:12},{id:2,name:'X IPS 2',desc:'Dekorasi kelas terbaik',count:9}]}];DB.save()}return d}
/* Tim */
function timPage(v){const d=S4(),me=ME.name,mine=d.teams.filter(t=>t.members.some(m=>m.name===me)),inv=mine.filter(t=>t.members.find(m=>m.name===me).st==='Diundang');
v.innerHTML=`<div class="bar"><button class="btn sm" onclick="teamForm()">+ Buat tim</button></div>`+(inv.length?`<h3>Undangan untuk saya</h3>`+inv.map(t=>`<div class="card" style="margin-bottom:10px">${esc(t.name)} · ${esc(cn(t.comp))} <span class="muted">(ketua: ${esc(t.leader)})</span><br><button class="btn sm ok" onclick="answerInv(${t.id},true)">Terima</button> <button class="btn sm bad" onclick="answerInv(${t.id},false)">Tolak</button></div>`).join(''):'')+
'<h3>Tim saya</h3>'+(mine.filter(t=>!inv.includes(t)).map(t=>{const ld=t.leader===me;return `<div class="card" style="margin-bottom:10px"><b>${esc(t.name)}</b> <span class="tag">${esc(cn(t.comp))}</span> ${t.locked?'<span class="tag ok">Terdaftar 🔒</span>':''}<p>${t.members.map(m=>`${esc(m.name)}${m.name===t.leader?' 👑':''} <span class="tag ${m.st==='Setuju'?'ok':'warn'}">${m.st}</span>`).join('<br>')}</p>${ld&&!t.locked?`<button class="btn sm alt" onclick="teamForm(${t.id})">Ubah anggota</button> <button class="btn sm" onclick="lockTeam(${t.id})">Kunci & daftar</button>`:''}</div>`}).join('')||'<div class="card empty">Belum punya tim</div>')}
function teamForm(id){const d=S4(),t=id?d.teams.find(x=>x.id==id):{name:'',comp:d.comps.find(c=>c.type==='Tim')?.id,members:[{name:ME.name,st:'Setuju'}]},have=t.members.map(m=>m.name);
modal(id?'Ubah anggota':'Buat tim',`<label>Nama tim<input id="tn" value="${esc(t.name)}" ${id?'disabled':''}></label><label>Lomba<select id="tc" ${id?'disabled':''}>${d.comps.filter(c=>c.type==='Tim').map(c=>`<option value="${c.id}" ${c.id==t.comp?'selected':''}>${esc(c.name)} — ${esc(c.req)}</option>`).join('')}</select></label><b>Anggota</b>${d.students.filter(s=>s.name!==ME.name).map(s=>`<label><input type="checkbox" class="tm" value="${esc(s.name)}" ${have.includes(s.name)?'checked':''} style="width:auto"> ${esc(s.name)} (${esc(s.cls)})</label>`).join('')}`,()=>{
const sel=[...document.querySelectorAll('.tm:checked')].map(i=>i.value),nm=$('#tn').value.trim(),cid=+$('#tc').value;if(nm.length<3){toast('Nama tim min. 3 karakter',1);return false}if(sel.length<1||sel.length>9){toast('Pilih 1–9 anggota',1);return false}
const clash=sel.find(s=>d.teams.some(x=>x.id!=id&&x.comp===cid&&x.members.some(m=>m.name===s)));if(clash){toast(clash+' sudah di tim lain untuk lomba ini',1);return false}
const old=Object.fromEntries(t.members.map(m=>[m.name,m.st]));t.members=[{name:ME.name,st:'Setuju'},...sel.map(n=>({name:n,st:old[n]||'Diundang'}))];
if(!id){Object.assign(t,{id:DB.nextId(d.teams),name:nm,comp:cid,leader:ME.name,locked:false});d.teams.push(t)}DB.log(ME.name,(id?'Mengubah':'Membuat')+' tim '+t.name,'Tim');DB.save();toast('Tim disimpan, undangan terkirim');refresh()})}
function answerInv(id,ok){const t=S4().teams.find(x=>x.id==id);if(ok)t.members.find(m=>m.name===ME.name).st='Setuju';else t.members=t.members.filter(m=>m.name!==ME.name);DB.save();toast(ok?'Bergabung ke tim':'Undangan ditolak');refresh()}
function lockTeam(id){const d=S4(),t=d.teams.find(x=>x.id==id);if(t.members.some(m=>m.st!=='Setuju'))return toast('Semua anggota harus menyetujui undangan',1);
confirmBox(`Kunci tim ${esc(t.name)} dan kirim pendaftaran? Setelah itu anggota tidak bisa diubah.`,()=>{t.locked=true;d.regs.push({id:DB.nextId(d.regs),comp:t.comp,who:t.name,cls:ME.cls,date:new Date().toISOString().slice(0,10),status:'Menunggu',reason:''});DB.log(ME.name,'Mendaftarkan tim '+t.name,'Registrasi');notify('admin','Pendaftaran tim baru: '+t.name);DB.save();toast('Pendaftaran tim terkirim');refresh()},'Kunci & daftar')}
function adminTim(v){const d=S4();v.innerHTML=d.teams.length?`<div class="scroll"><table><tr><th>Tim</th><th>Lomba</th><th>Ketua</th><th>Anggota</th><th>Status</th><th>Aksi</th></tr>${d.teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(cn(t.comp))}</td><td>${esc(t.leader)}</td><td>${t.members.length}</td><td>${t.locked?'Terkunci':'Terbuka'}</td><td>${t.locked?`<button class="btn sm alt" onclick="unlockTeam(${t.id})">Buka kunci</button> `:''}<button class="btn sm bad" onclick="delTeam(${t.id})">Hapus</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada tim</div>'}
function unlockTeam(id){confirmBox('Buka kunci tim?',()=>{S4().teams.find(t=>t.id==id).locked=false;DB.log(ME.name,'Membuka kunci tim #'+id,'Tim');DB.save();refresh()})}
function delTeam(id){confirmBox('Hapus tim?',()=>{const d=S4();d.teams=d.teams.filter(t=>t.id!=id);DB.log(ME.name,'Menghapus tim #'+id,'Tim');DB.save();refresh()},'Hapus')}
/* Voting */
function votePage(v){const d=S4();v.innerHTML=d.votes.map(x=>{const tot=x.cands.reduce((s,c)=>s+c.count,0)||1,mine=x.voted[ME.u];return `<div class="card" style="margin-bottom:14px"><h3>${esc(x.title)} <span class="tag ${x.open?'ok':'bad'}">${x.open?'Dibuka':'Ditutup'}</span></h3>${x.cands.map(c=>`<div style="margin:8px 0"><b>${esc(c.name)}</b> <span class="muted">${esc(c.desc)}</span><div style="background:var(--lb);border-radius:6px"><div style="width:${Math.round(c.count/tot*100)}%;background:var(--blue);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;min-width:30px">${c.count}</div></div>${x.open&&!mine?`<button class="btn sm" onclick="castVote(${x.id},${c.id})">Pilih</button>`:mine===c.id?'<span class="tag ok">Pilihan Anda</span>':''}</div>`).join('')||'<div class="muted">Belum ada kandidat</div>'}</div>`}).join('')||'<div class="card empty">Belum ada voting</div>'}
function castVote(vid,cid){confirmBox('Kirim suara? Satu suara per kategori dan tidak dapat diubah.',()=>{const x=S4().votes.find(v=>v.id==vid);if(x.voted[ME.u])return;x.voted[ME.u]=cid;x.cands.find(c=>c.id==cid).count++;DB.save();toast('Suara tercatat');refresh()},'Kirim suara')}
function adminVote(v){const d=S4();v.innerHTML=`<div class="bar"><button class="btn sm" onclick="voteForm()">+ Kategori voting</button></div>`+d.votes.map(x=>`<div class="card" style="margin-bottom:14px"><h3>${esc(x.title)} <span class="tag ${x.open?'ok':'bad'}">${x.open?'Dibuka':'Ditutup'}</span></h3>${x.cands.map(c=>`<p>${esc(c.name)} — <b>${c.count}</b> suara <button class="btn sm bad" onclick="delCand(${x.id},${c.id})">Hapus</button></p>`).join('')||'<p class="muted">Belum ada kandidat</p>'}<button class="btn sm alt" onclick="candForm(${x.id})">+ Kandidat</button> <button class="btn sm ${x.open?'bad':'ok'}" onclick="togVote(${x.id})">${x.open?'Tutup':'Buka'} voting</button> <button class="btn sm bad" onclick="delVote(${x.id})">Hapus</button></div>`).join('')}
function voteForm(){modal('Kategori voting','<label>Judul<input id="vt"></label>',()=>{if(!$('#vt').value.trim()){toast('Judul wajib',1);return false}const d=S4();d.votes.push({id:DB.nextId(d.votes),title:$('#vt').value.trim(),open:false,voted:{},cands:[]});DB.log(ME.name,'Membuat voting '+$('#vt').value,'Voting');DB.save();refresh()})}
function candForm(id){modal('Tambah kandidat','<label>Nama kelas/peserta<input id="cn1"></label><label>Deskripsi<input id="cd1"></label>',()=>{if(!$('#cn1').value.trim()){toast('Nama wajib',1);return false}const x=S4().votes.find(v=>v.id==id);x.cands.push({id:DB.nextId(x.cands),name:$('#cn1').value.trim(),desc:$('#cd1').value,count:0});DB.save();refresh()})}
function delCand(v,c){confirmBox('Hapus kandidat?',()=>{const x=S4().votes.find(a=>a.id==v);x.cands=x.cands.filter(k=>k.id!=c);DB.save();refresh()},'Hapus')}
function togVote(id){const x=S4().votes.find(v=>v.id==id);x.open=!x.open;DB.log(ME.name,(x.open?'Membuka':'Menutup')+' voting '+x.title,'Voting');notify('student','Voting '+x.title+(x.open?' dibuka':' ditutup'));DB.save();refresh()}
function delVote(id){confirmBox('Hapus kategori voting?',()=>{const d=S4();d.votes=d.votes.filter(v=>v.id!=id);DB.save();refresh()},'Hapus')}
/* Profil */
function profil(v){const d=S4(),rg=d.regs.filter(r=>r.who===ME.name),R={student:'Siswa',judge:'Guru/Juri',admin:'Admin/Panitia',super:'Super Admin'};
v.innerHTML=`<div class="card"><div style="font-size:2.5rem">👤</div><h3>${esc(ME.name)}</h3><p class="muted">${R[ME.role]} · @${esc(ME.u)}${ME.cls?` · ${esc(ME.cls)} · NIS ${esc(ME.nis)}`:''}<br>${esc(ME.email||ME.u+'@lombaku.sch.id')}</p><button class="btn sm" onclick="profForm()">Edit profil</button> <button class="btn sm alt" onclick="passForm()">Ganti password</button></div>`+(ME.role==='student'?`<h3>Riwayat pendaftaran (${rg.length})</h3>`+(rg.map(r=>`<div class="card" style="margin-bottom:8px">${esc(cn(r.comp))} ${badge(r.status)}${r.reason?`<br><span class="muted">Alasan: ${esc(r.reason)}</span>`:''}</div>`).join('')||'<div class="muted">Belum ada</div>'):'')}
function profForm(){modal('Edit profil',`<label>Nama<input id="pn" value="${esc(ME.name)}"></label><label>Email<input id="pe" type="email" value="${esc(ME.email||'')}"></label>`,()=>{const n=$('#pn').value.trim(),e=$('#pe').value.trim();if(!n||(e&&!/^\S+@\S+\.\S+$/.test(e))){toast('Nama/email tidak valid',1);return false}ME.name=n;ME.email=e;$('#who').textContent=n;DB.save();toast('Profil disimpan');refresh()})}
function passForm(){modal('Ganti password','<label>Password lama<input id="p0" type="password"></label><label>Password baru (min. 6)<input id="p1" type="password"></label>',()=>{if($('#p0').value!==ME.p||$('#p1').value.length<6){toast('Password lama salah / baru terlalu pendek',1);return false}ME.p=$('#p1').value;DB.save();toast('Password diganti')})}
/* Manajemen kelas */
function adminKelas(v){const d=S4();v.innerHTML=`<div class="bar"><button class="btn sm" onclick="classForm()">+ Kelas</button></div><div class="scroll"><table><tr><th>Kelas</th><th>Siswa</th><th>Pendaftaran</th><th>Juara</th><th>Aksi</th></tr>${d.classes.map(c=>`<tr><td>${esc(c)}</td><td>${d.students.filter(s=>s.cls===c).length}</td><td>${d.regs.filter(r=>r.cls===c).length}</td><td>${d.champs.filter(x=>x.pub&&x.cls.startsWith(c)).length}</td><td><button class="btn sm alt" onclick="studentsOf('${esc(c)}')">Siswa</button> <button class="btn sm alt" onclick="classForm('${esc(c)}')">Ubah nama</button> <button class="btn sm bad" onclick="delClass('${esc(c)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function classForm(old){modal(old?'Ubah nama kelas':'Tambah kelas',`<label>Nama kelas<input id="kn2" value="${esc(old||'')}"></label>`,()=>{const n=$('#kn2').value.trim(),d=S4();if(!n||d.classes.includes(n)){toast('Nama kosong / sudah ada',1);return false}
if(old){d.classes[d.classes.indexOf(old)]=n;d.students.forEach(s=>{if(s.cls===old)s.cls=n});d.regs.forEach(r=>{if(r.cls===old)r.cls=n});d.matches.forEach(m=>{if(m.a===old)m.a=n;if(m.b===old)m.b=n});if(ME.cls===old)ME.cls=n}else d.classes.push(n);DB.log(ME.name,(old?'Mengubah kelas '+old+' → ':'Menambah kelas ')+n,'Kelas');DB.save();toast('Kelas disimpan');refresh()})}
function delClass(c){const d=S4();if(d.students.some(s=>s.cls===c))return toast('Kelas masih punya siswa',1);confirmBox('Hapus kelas '+esc(c)+'?',()=>{d.classes=d.classes.filter(x=>x!==c);DB.save();refresh()},'Hapus')}
function studentsOf(c){const d=S4();modal('Siswa '+esc(c),d.students.filter(s=>s.cls===c).map(s=>`<p>${esc(s.name)} <span class="muted">${s.nis}</span> <button class="btn sm bad" onclick="rmStudent('${esc(s.nis)}','${esc(c)}')">Keluarkan</button></p>`).join('')+`<label>Tambah siswa<input id="sn"></label><button class="btn sm" onclick="addStudent('${esc(c)}')">Tambah</button>`)}
function rmStudent(n,c){const d=S4();d.students=d.students.filter(s=>s.nis!==n);DB.save();studentsOf(c);toast('Siswa dikeluarkan')}
function addStudent(c){const n=$('#sn').value.trim();if(!n)return toast('Nama wajib',1);const d=S4();d.students.push({name:n,cls:c,nis:'2024'+(900+d.students.length)});DB.save();studentsOf(c);toast('Siswa ditambahkan')}
/* Manajemen juri */
function adminJuri(v){const j=S4().users.filter(u=>u.role==='judge');v.innerHTML=`<div class="bar"><button class="btn sm" onclick="juriForm()">+ Akun juri</button></div><div class="scroll"><table><tr><th>Nama</th><th>Username</th><th>Lomba</th><th>Nilai terkirim</th><th>Aksi</th></tr>${j.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.u)}</td><td>${u.comps.map(c=>esc(cn(c))).join(', ')||'-'}</td><td>${S4().scores.filter(s=>s.judge===u.u&&s.status==='sent').length}</td><td><button class="btn sm alt" onclick="juriForm('${esc(u.u)}')">Edit</button> <button class="btn sm bad" onclick="delJuri('${esc(u.u)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function juriForm(un){const d=S4(),u=un?d.users.find(x=>x.u===un):{name:'',u:'',p:'',comps:[]};modal(un?'Edit juri':'Akun juri',`<label>Nama<input id="jn" value="${esc(u.name)}"></label><label>Username<input id="ju" value="${esc(u.u)}" ${un?'disabled':''}></label><label>Password<input id="jp" value="${esc(u.p)}"></label><b>Lomba yang dinilai</b>${d.comps.map(c=>`<label><input type="checkbox" class="jc" value="${c.id}" ${u.comps.includes(c.id)?'checked':''} style="width:auto"> ${esc(c.name)}</label>`).join('')}`,()=>{
const n=$('#jn').value.trim(),us=$('#ju').value.trim(),p=$('#jp').value;if(!n||!us||p.length<6){toast('Nama, username, password (min. 6) wajib',1);return false}if(!un&&d.users.some(x=>x.u===us)){toast('Username sudah dipakai',1);return false}
Object.assign(u,{name:n,u:us,p,role:'judge',comps:[...document.querySelectorAll('.jc:checked')].map(i=>+i.value)});if(!un)d.users.push(u);DB.log(ME.name,(un?'Mengubah':'Menambah')+' juri '+n,'Juri');DB.save();toast('Akun juri disimpan');refresh()})}
function delJuri(un){confirmBox('Hapus akun juri?',()=>{const d=S4();d.users=d.users.filter(u=>u.u!==un);DB.log(ME.name,'Menghapus juri '+un,'Juri');DB.save();refresh()},'Hapus')}
PAGES.student.push({id:'tim',label:'Tim Saya',icon:'👥',render:timPage},{id:'vote',label:'Favorite Voting',icon:'⭐',render:votePage},{id:'profil',label:'Profil',icon:'👤',render:profil});
PAGES.admin.push({id:'kelas',label:'Manajemen Kelas',icon:'🏫',render:adminKelas},{id:'tim',label:'Manajemen Tim',icon:'👥',render:adminTim},{id:'juri',label:'Manajemen Juri',icon:'⚖️',render:adminJuri},{id:'vote',label:'Manajemen Voting',icon:'⭐',render:adminVote},{id:'profil',label:'Profil',icon:'👤',render:profil});

/* Tahap 5: Lapak Kelas & Premium */
function S5(){const d=S4();if(!d.lapak){d.lapak={'XI IPA 1':{slogan:'Satu hati, seribu prestasi',desc:'Kelas penuh semangat dan kreativitas.',gal:['Latihan yel-yel','Persiapan futsal']},'XII IPA 3':{slogan:'Senior yang tak pernah pensiun',desc:'Juara bertahan tenis meja.',gal:['Penyerahan piala']}};d.prem=[];DB.save()}return d}
const lpOf=c=>{const d=S5();return d.lapak[c]||(d.lapak[c]={slogan:'Belum ada slogan',desc:'Belum ada deskripsi.',gal:[]})};
const isPrem=u=>S5().prem.some(p=>p.user===u&&p.status==='Terverifikasi'&&p.exp>Date.now());
const lastPrem=u=>{const l=S5().prem.filter(p=>p.user===u).sort((a,b)=>b.id-a.id)[0];return l&&l.status==='Terverifikasi'&&l.exp<=Date.now()?{...l,status:'Kedaluwarsa'}:l};
const fmt=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function cstats(c){const d=S5(),r=rankData().find(x=>x.cls===c)||{wins:0,pts:0,juara:0,m:[0,0,0]};return{mem:d.students.filter(s=>s.cls===c),regs:d.regs.filter(r=>r.cls===c&&r.status==='Diterima'),ch:d.champs.filter(x=>x.pub&&x.cls.startsWith(c)),...r}}
function lapak(v){const d=S5(),ad=ME.role==='admin',sel=window._lc;
if(sel){const s=cstats(sel),l=lpOf(sel),own=ME.cls===sel,can=ad||own;
v.innerHTML=`<button class="btn sm alt" onclick="window._lc=null;refresh()">← Semua kelas</button><div class="hero" style="margin-top:12px"><div style="font-size:2rem">🏫</div><h2 style="margin:0">${esc(sel)}</h2><i>${esc(l.slogan)}</i></div>
<div class="grid"><div class="card stat"><b>${s.mem.length}</b>Anggota</div><div class="card stat"><b>${s.regs.length}</b>Lomba diikuti</div><div class="card stat"><b>${s.wins}</b>Kemenangan</div><div class="card stat"><b>${s.pts}</b>Total poin</div></div>
<div class="card" style="margin-top:14px"><h3>Profil kelas <span class="tag">Dikelola kelas</span></h3><p>${esc(l.desc)}</p>${can?`<button class="btn sm" onclick="lapakForm('${esc(sel)}')">Edit profil & galeri</button>`:''}<h4>Galeri</h4><div class="grid">${l.gal.map(g=>`<div class="card" style="background:var(--lb)">🖼 ${esc(g)}</div>`).join('')||'<span class="muted">Belum ada dokumentasi</span>'}</div><h4>Anggota</h4><p class="muted">${s.mem.map(m=>esc(m.name)).join(', ')||'-'}</p></div>
<div class="card" style="margin-top:14px"><h3>Data resmi <span class="tag ok">Diverifikasi panitia</span></h3><h4>Riwayat keikutsertaan</h4><p>${s.regs.map(r=>esc(cn(r.comp))+(r.who!==r.cls?' ('+esc(r.who)+')':'')).join(', ')||'-'}</p><h4>Prestasi</h4>${s.ch.map(x=>`<p>${medal(x.pos)} ${posLbl(x.pos)} — ${esc(cn(x.comp))}</p>`).join('')||'<span class="muted">Belum ada prestasi resmi</span>'}</div>`;return}
const prem=isPrem(ME.u)||ad;
v.innerHTML=`<div class="bar"><button class="btn sm" onclick="compareForm()">⚖ Bandingkan kelas ${prem?'':'🔒'}</button></div><div class="grid">${d.classes.map(c=>{const ok=prem||c===ME.cls;return `<div class="card"><b>${esc(c)}</b> ${c===ME.cls?'<span class="tag">Kelas saya</span>':''}<p class="muted">${esc(lpOf(c).slogan)}</p>${ok?`<button class="btn sm" onclick="window._lc='${esc(c)}';refresh()">Buka Lapak</button>`:'<button class="btn sm alt" onclick="needPrem()">🔒 Butuh Premium</button>'}${ad?` <button class="btn sm alt" onclick="lapakForm('${esc(c)}')">Edit</button>`:''}</div>`}).join('')}</div>`}
function needPrem(){confirmBox('Lapak kelas lain hanya untuk pengguna Premium (Rp20.000 / 14 hari). Buka halaman Premium?',()=>go('premium'),'Lihat Premium')}
function lapakForm(c){const l=lpOf(c);modal('Edit Lapak '+esc(c),`<label>Slogan<input id="ls" value="${esc(l.slogan)}"></label><label>Deskripsi<textarea id="ld">${esc(l.desc)}</textarea></label><label>Galeri (satu keterangan per baris)<textarea id="lg">${esc(l.gal.join('\n'))}</textarea></label><p class="muted">Nilai, ranking, dan prestasi resmi hanya dapat diubah panitia lewat menu hasil.</p>`,()=>{if(!$('#ls').value.trim()){toast('Slogan wajib',1);return false}
Object.assign(l,{slogan:$('#ls').value.trim(),desc:$('#ld').value.trim(),gal:$('#lg').value.split('\n').map(x=>x.trim()).filter(Boolean)});DB.log(ME.name,'Mengubah Lapak '+c,'Lapak');DB.save();toast('Lapak disimpan');refresh()})}
function compareForm(){if(!(isPrem(ME.u)||ME.role==='admin'))return needPrem();const o=S5().classes.map(c=>`<option>${esc(c)}</option>`).join('');
modal('Bandingkan kelas',`<label>Kelas A<select id="ca">${o}</select></label><label>Kelas B<select id="cb">${o}</select></label><div id="cr2"></div>`,null);
const go2=()=>{const a=cstats($('#ca').value),b=cstats($('#cb').value),A=$('#ca').value,B=$('#cb').value,rows=[['Anggota',a.mem.length,b.mem.length],['Lomba diikuti',a.regs.length,b.regs.length],['Kemenangan',a.wins,b.wins],['Juara',a.juara,b.juara],['Total poin',a.pts,b.pts]];
$('#cr2').innerHTML=`<table><tr><th></th><th>${esc(A)}</th><th>${esc(B)}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td ${r[1]>r[2]?'style="font-weight:700;color:var(--ok)"':''}>${r[1]}</td><td ${r[2]>r[1]?'style="font-weight:700;color:var(--ok)"':''}>${r[2]}</td></tr>`).join('')}</table>`};
$('#ca').oninput=$('#cb').oninput=go2;$('#cb').selectedIndex=Math.min(1,S5().classes.length-1);go2()}
/* Premium */
function premium(v){const p=lastPrem(ME.u),act=isPrem(ME.u),pa=S5().prem.filter(x=>x.user===ME.u&&x.status==='Terverifikasi').sort((a,b)=>b.exp-a.exp)[0];
v.innerHTML=`<div class="hero"><h2 style="margin:0">⭐ LombaKu Premium</h2><div>Rp20.000 · 14 hari</div></div><div class="card"><h3>Keuntungan</h3><p>✔ Lihat seluruh Lapak Kelas<br>✔ Bandingkan statistik dua kelas<br>✔ Riwayat, prestasi, dan dokumentasi kelas lain<br><span class="muted">Premium hanya untuk melihat, bukan mengedit Lapak kelas lain.</span></p><h3>Status</h3>${act?`<p><span class="tag ok">Aktif</span> Berlaku sampai <b>${fmt(pa.exp)}</b> (${Math.ceil((pa.exp-Date.now())/864e5)} hari lagi)</p>`:p?`<p>${badge(p.status==='Terverifikasi'?'Diterima':p.status)} ${p.status==='Kedaluwarsa'?'Kedaluwarsa pada '+fmt(p.exp):p.status==='Ditolak'?'Pembayaran ditolak: '+esc(p.reason||'-'):'Menunggu verifikasi panitia'}</p>`:'<p class="muted">Belum berlangganan</p>'}
<h3>Cara bayar</h3><p>Transfer Rp20.000 ke <b>BCA 1234567890 a.n. Panitia LombaKu</b>, lalu isi konfirmasi pembayaran.</p><button class="btn" onclick="payForm()">Konfirmasi pembayaran</button></div>`}
function payForm(){const p=lastPrem(ME.u);if(p&&p.status==='Menunggu')return toast('Pembayaran sebelumnya masih diverifikasi',1);
modal('Konfirmasi pembayaran',`<label>Metode / bank pengirim<input id="pb"></label><label>Nama pengirim<input id="pq" value="${esc(ME.name)}"></label><label>Nominal (Rp)<input id="pr" type="number" value="20000"></label>`,()=>{if(!$('#pb').value.trim()||!$('#pq').value.trim()||+$('#pr').value!==20000){toast('Lengkapi data; nominal harus Rp20.000',1);return false}
const d=S5();d.prem.push({id:DB.nextId(d.prem),user:ME.u,who:ME.name,bank:$('#pb').value,date:Date.now(),status:'Menunggu'});notify('admin','Pembayaran Premium baru dari '+ME.name);DB.log(ME.name,'Mengirim konfirmasi Premium','Premium');DB.save();toast('Konfirmasi terkirim');refresh()},'Kirim')}
function adminPrem(v){const d=S5(),act=d.prem.filter(p=>p.status==='Terverifikasi'&&p.exp>Date.now());
v.innerHTML=`<div class="grid"><div class="card stat"><b>${act.length}</b>Premium aktif</div><div class="card stat"><b>${d.prem.filter(p=>p.status==='Menunggu').length}</b>Menunggu verifikasi</div></div><h3>Riwayat transaksi</h3>`+(d.prem.length?`<div class="scroll"><table><tr><th>Pengguna</th><th>Tanggal</th><th>Metode</th><th>Status</th><th>Berlaku s.d.</th><th>Aksi</th></tr>${[...d.prem].reverse().map(p=>{const st=p.status==='Terverifikasi'&&p.exp<=Date.now()?'Kedaluwarsa':p.status;return `<tr><td>${esc(p.who)}</td><td>${fmt(p.date)}</td><td>${esc(p.bank)}</td><td>${st}</td><td>${p.exp?fmt(p.exp):'-'}</td><td>${p.status==='Menunggu'?`<button class="btn sm ok" onclick="verPrem(${p.id})">Verifikasi</button> <button class="btn sm bad" onclick="rejPrem(${p.id})">Tolak</button>`:p.status==='Terverifikasi'?`<button class="btn sm alt" onclick="durPrem(${p.id})">Atur masa aktif</button>`:'-'}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Belum ada transaksi</div>')}
function verPrem(id){confirmBox('Verifikasi pembayaran? Premium aktif 14 hari.',()=>{const p=S5().prem.find(x=>x.id==id);p.status='Terverifikasi';p.exp=Date.now()+14*864e5;DB.log(ME.name,'Memverifikasi Premium '+p.who,'Premium');notify('student','Status Premium: aktif 14 hari');DB.save();toast('Terverifikasi');refresh()},'Verifikasi')}
function rejPrem(id){modal('Tolak pembayaran','<label>Alasan<input id="rj"></label>',()=>{if(!$('#rj').value.trim()){toast('Alasan wajib',1);return false}const p=S5().prem.find(x=>x.id==id);p.status='Ditolak';p.reason=$('#rj').value;DB.log(ME.name,'Menolak Premium '+p.who,'Premium');notify('student','Pembayaran Premium ditolak');DB.save();refresh()},'Tolak')}
function durPrem(id){modal('Atur masa aktif','<label>Sisa hari dari sekarang (0 = langsung kedaluwarsa)<input id="du" type="number" min="0" max="60" value="14"></label>',()=>{const n=+$('#du').value;if(!(n>=0&&n<=60)){toast('0–60 hari',1);return false}const p=S5().prem.find(x=>x.id==id);p.exp=Date.now()+n*864e5-(n===0?1:0);DB.log(ME.name,`Mengatur masa aktif ${p.who}: ${n} hari`,'Premium');DB.save();refresh()})}
function adminLapak(v){const d=S5();v.innerHTML=`<div class="scroll"><table><tr><th>Kelas</th><th>Slogan</th><th>Galeri</th><th>Aksi</th></tr>${d.classes.map(c=>`<tr><td>${esc(c)}</td><td>${esc(lpOf(c).slogan)}</td><td>${lpOf(c).gal.length}</td><td><button class="btn sm alt" onclick="lapakForm('${esc(c)}')">Edit</button> <button class="btn sm" onclick="window._lc='${esc(c)}';go('lapakview')">Lihat</button></td></tr>`).join('')}</table></div>`}
PAGES.student.push({id:'lapak',label:'Lapak Kelas',icon:'🏫',render:lapak},{id:'premium',label:'Premium',icon:'⭐',render:premium});
PAGES.admin.push({id:'lapak',label:'Manajemen Lapak Kelas',icon:'🏫',render:adminLapak},{id:'lapakview',label:'Pratinjau Lapak',icon:'👁',render:lapak},{id:'premium',label:'Manajemen Premium',icon:'⭐',render:adminPrem});

/* Tahap 6: laporan, peserta, bantuan, arsip, galeri, pengaturan, super admin, dashboard */
function S6(){const d=S5();if(!d.gallery){d.gallery=[{id:1,cap:'Penyerahan piala tenis meja',cat:'Penyerahan hadiah'},{id:2,cap:'Semifinal futsal',cat:'Pertandingan'},{id:3,cap:'Rapat persiapan panitia',cat:'Kegiatan'}];
d.archive=[{id:1,name:'Class Meeting 2025',date:'Desember 2025',desc:'Event tahun lalu dengan 8 lomba.',champs:['Futsal: XII IPA 1','Cerdas Cermat: XI IPA 2']}];
d.errors=[{id:1,t:'2026-11-20 14:02',lvl:'ERROR',msg:'Gagal memuat poster event',detail:'Resource poster.jpg tidak ditemukan (simulasi)',done:false},{id:2,t:'2026-11-21 08:15',lvl:'WARN',msg:'Penyimpanan lokal hampir penuh',detail:'Pemakaian 4.2MB dari 5MB (simulasi)',done:false}];
d.settings={regClosed:false,siteName:'LombaKu',timeout:30};DB.save()}return d}
function csv(n,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download=n+'.csv';a.click();toast('CSV diekspor')}
window.addEventListener('error',e=>{try{const d=S6();d.errors.unshift({id:DB.nextId(d.errors),t:new Date().toLocaleString('id-ID'),lvl:'ERROR',msg:e.message,detail:(e.filename||'')+':'+e.lineno,done:false});DB.save()}catch(_){}});
const _rf=regForm;regForm=function(id){if(S6().settings.regClosed)return toast('Pendaftaran ditutup oleh panitia',1);_rf(id)};
/* Laporan */
const REP={'Peserta per lomba':()=>[['Lomba','Diterima','Menunggu','Kuota'],...DB.d.comps.map(c=>[c.name,DB.d.regs.filter(r=>r.comp==c.id&&r.status==='Diterima').length,DB.d.regs.filter(r=>r.comp==c.id&&r.status==='Menunggu').length,c.quota])],
'Pendaftaran':()=>[['Peserta','Kelas','Lomba','Status'],...DB.d.regs.map(r=>[r.who,r.cls,cn(r.comp),r.status])],
'Hasil penilaian':()=>{const g={};S6().scores.filter(s=>s.status==='sent').forEach(s=>(g[s.comp+'|'+s.who]=g[s.comp+'|'+s.who]||[]).push(s.total));return[['Lomba','Peserta','Rata-rata','Jumlah juri'],...Object.entries(g).map(([k,a])=>[cn(+k.split('|')[0]),k.split('|')[1],(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1),a.length])]},
'Hasil juara':()=>[['Lomba','Juara','Kelas/Peserta','Nilai','Status'],...S6().champs.sort((a,b)=>a.comp-b.comp||a.pos-b.pos).map(x=>[cn(x.comp),x.pos,x.cls,x.score,x.pub?'Publik':'Draft'])],

/* Tahap 7: bagan otomatis (SE/bye/round robin/juara 3), detail pendaftaran, juara harapan, poster */
const posLbl=p=>p>3?'Harapan '+(p-3):'Juara '+p;
function genForm(){if(!canEdit())return toast('Mulai edit bagan dulu',1);const cid=+$('#bc2').value,t=S6().regs.filter(r=>r.comp===cid&&r.status==='Diterima').map(r=>r.who).join('\n');
modal('Buat bagan otomatis — '+esc(cn(cid)),`<label>Jenis bagan<select id="gt"><option value="se">Single elimination (bye otomatis)</option><option value="se3">Gugur + perebutan juara 3</option><option value="rr">Grup / round robin</option></select></label><label>Peserta (satu per baris)<textarea id="gp" rows="6">${esc(t)}</textarea></label><p class="muted">Bagan lomba ini yang sudah ada akan diganti (masih bisa dibatalkan sebelum Simpan).</p>`,()=>{
const T=$('#gp').value.split('\n').map(x=>x.trim()).filter(Boolean),ty=$('#gt').value;if(new Set(T).size!==T.length||T.length<(ty==='rr'?2:3)){toast('Minimal '+(ty==='rr'?2:3)+' peserta unik',1);return false}
const d=S6();d.matches=d.matches.filter(m=>m.comp!==cid);let id=DB.nextId(d.matches.concat(JSON.parse(d.editing.snap)));const mk=o=>{const m={id:id++,comp:cid,sa:0,sb:0,status:'UPCOMING',date:S6().event.date.slice(0,10),time:'08:00',loc:cn(cid),...o};d.matches.push(m);return m};
if(ty==='rr'){for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++)mk({round:'Penyisihan',a:T[i],b:T[j]})}
else{let p=1;while(p<T.length)p*=2;const s=[...T];while(s.length<p)s.push('BYE');let cur=[];for(let i=0;i<p/2;i++)cur.push({a:s[i],b:s[p-1-i]});let rs=[];
while(true){const k=cur.length,nm=k===1?'Final':k===2?'Semifinal':'Babak '+k*2;const ms=cur.map(x=>mk({round:nm,a:x.a,b:x.b}));rs.push(ms);if(k===1)break;cur=Array.from({length:k/2},()=>({a:'TBD',b:'TBD'}))}
rs.forEach((ms,ri)=>{if(ri<rs.length-1)ms.forEach((m,i)=>{m.next=rs[ri+1][i>>1].id;m.slot=i%2?'b':'a'})});
rs[0].forEach(m=>{if(m.b==='BYE'||m.a==='BYE'){const w=m.a==='BYE'?m.b:m.a;Object.assign(m,{a:w,b:'BYE',sa:1,sb:0,status:'FINISHED'});const n=d.matches.find(x=>x.id===m.next);if(n)n[m.slot]=w}});
if(ty==='se3')mk({round:'Juara 3',a:'TBD',b:'TBD'})}
d.editing.n++;DB.log(ME.name,'Membuat bagan otomatis '+cn(cid)+' ('+ty+')','Bagan');DB.save();toast('Bagan dibuat (belum diterapkan)');refresh();$('#bc2').value=cid;$('#bc2').oninput()},'Buat bagan')}
/* Detail pendaftaran siswa */
function riwayat2(v){const l=DB.d.regs.filter(r=>r.who===ME.name||r.cls===ME.cls);v.innerHTML=l.length?`<div class="scroll"><table><tr><th>Lomba</th><th>Tanggal</th><th>Peserta</th><th>Status</th><th></th></tr>${l.map(r=>`<tr><td>${esc(cn(r.comp))}</td><td>${r.date}</td><td>${esc(r.who)}</td><td>${badge(r.status)}</td><td><button class="btn sm alt" onclick="regDetail(${r.id})">Detail</button> ${r.status==='Menunggu'?`<button class="btn sm bad" onclick="cancelReg(${r.id})">Batalkan</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="card empty">Belum ada pendaftaran</div>'}
function regDetail(id){const r=DB.d.regs.find(x=>x.id==id),c=DB.d.comps.find(x=>x.id==r.comp),t=S6().teams.find(x=>x.name===r.who&&x.comp===r.comp);modal('Detail pendaftaran',`<p><b>${esc(c?.name)}</b> ${badge(r.status)}</p><p>Peserta: ${esc(r.who)} (${esc(r.cls)})<br>Tanggal daftar: ${r.date}<br>Jadwal: ${c?.date} · ${esc(c?.loc)}</p>${r.reason?`<p>Alasan: ${esc(r.reason)}</p>`:''}${t?`<p>Anggota tim: ${t.members.map(m=>esc(m.name)).join(', ')}</p>`:''}`)}
PAGES.student.find(p=>p.id==='riwayat').render=riwayat2;
/* Poster event */
function posterUp(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>400*1024)return toast('Maksimal 400 KB',1);const r=new FileReader();r.onload=()=>{S6().event.poster=r.result;DB.log(ME.name,'Mengunggah poster event','Event');DB.save();toast('Poster diunggah');refresh()};r.readAsDataURL(f)};i.click()}

boot()</script></body></html>
